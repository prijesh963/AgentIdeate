name: Release

# Push a tag matching the version in build.gradle.kts (v0.4.0 for version = "0.4.0") to publish a
# GitHub Release with the jar, its SHA-256 and its SBOM, ready to upload to Artifactory.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the build version
        run: |
          VERSION=$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in build.gradle.kts"
            exit 1
          fi
      - name: Build, test and package
        run: ./gradlew build release
      - name: Benchmark on the sample (answers must hold every expected fact)
        run: java -jar build/libs/agentideate.jar bench benchmark/shop.json --repo samples/shop | tee build/benchmark.txt
        env:
          AGENTIDEATE_HOME: ${{ runner.temp }}/agentideate-home
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install: download agentideate.jar, verify it against agentideate.jar.sha256, then follow the README's setup."
            echo
            echo "SHA-256: $(cut -d' ' -f1 build/libs/agentideate.jar.sha256)"
            echo
            echo '```'
            cat build/benchmark.txt
            echo '```'
          } > build/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            build/libs/agentideate.jar \
            build/libs/agentideate.jar.sha256 \
            build/sbom/agentideate-sbom.json \
            --title "agentideate $GITHUB_REF_NAME" \
            --notes-file build/release-notes.md
