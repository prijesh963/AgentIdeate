spring:
  application:
    name: inventory-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/inventory
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory

app:
  topics:
    # the cancelled-order topic is configured, not hard-coded
    order-cancelled: order.cancelled
  warehouses:
  - north
  - south
